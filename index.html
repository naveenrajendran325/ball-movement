<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Movement</title>
    <style>
        .ball-style {
            width: 100px;
            height: 100px;
            border-radius: 100%;
            position: absolute;
        }
        #ball {
            background-color: rgb(16, 218, 83);
            left: 0;
            top: 50px;
        }
        #ball2 {
            background-color: rgb(218, 16, 16);
            left: 1300px;
            top: 200px;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="ball" class="ball-style"></div>
        <div id="ball2" class="ball-style"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
